<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowerpedia · Iniciar sesión</title><link rel="stylesheet" href="{{ url_for('admin_static',filename='admin.css') }}"></head><body class="auth-page"><main class="auth-card"><div class="brand-mark auth-mark">✿</div><p class="eyebrow">ACCESO ADMINISTRATIVO</p><h1>Iniciar sesión</h1><p class="muted">Acceso al panel de administración para administradores y personal autorizado.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert error">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary full" type="submit">Entrar</button></form><a class="auth-link" href="/access">Volver al catálogo</a></main></body></html>
