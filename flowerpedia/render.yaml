services:
  - type: web
    name: flowerpedia
    runtime: python
    plan: starter
    region: ohio
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: flowerpedia-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLOWERPEDIA_DATA_DIR
        value: /var/data
      - key: FLOWERPEDIA_UPLOAD_DIR
        value: /var/data/uploads
      - key: FLOWERPEDIA_DB_PATH
        value: /var/data/flowerpedia.sqlite3
      - key: FLOWERPEDIA_WORKBOOK_PATH
        value: /var/data/current_week.xlsx
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FLOWERPEDIA_AUTOINIT
        value: "1"
      - key: FLOWERPEDIA_REQUIRE_INITIAL_ADMIN
        value: "1"
      - key: FLOWERPEDIA_DISABLE_EXCEL_WATCHER
        value: "1"
      - key: INITIAL_ADMIN_USERNAME
        value: caguilar
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
