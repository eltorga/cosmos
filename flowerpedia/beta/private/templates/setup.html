<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowerpedia · Configuración inicial</title><link rel="stylesheet" href="{{ url_for('admin_static',filename='admin.css') }}"></head><body class="auth-page"><main class="auth-card"><div class="brand-mark auth-mark">✿</div><p class="eyebrow">PRIMER INICIO</p><h1>Configura Flowerpedia</h1><p class="muted">Crea la cuenta administradora para gestionar el catálogo y las cuentas de Flowerpedia.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ 'error' if category=='error' else 'success' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Usuario administrador<input name="username" required minlength="3" autocomplete="username"></label><label>Contraseña administradora<input name="password" type="password" required minlength="4" autocomplete="new-password"></label><label>Confirmar contraseña<input name="confirm_password" type="password" required minlength="4" autocomplete="new-password"></label><button class="btn primary full" type="submit">Crear administrador</button></form></main></body></html>
