<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · BloomDesk</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">✿</div><p class="eyebrow">CATÁLOGO PRIVADO</p>
    <h1>BloomDesk</h1><p class="muted">Introduce la contraseña para consultar el catálogo de productos.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Contraseña del catálogo<input type="password" name="site_password" required autofocus autocomplete="current-password"></label>
      <button class="btn primary full" type="submit">Entrar al catálogo</button>
    </form>
    <a class="text-link" href="{{ url_for('login_page') }}">Acceso de personal</a>
  </main>
</body></html>
